name: Publish probe package

# Baut das Installationspaket der Sonde (tools/ipam-agent) und legt es im
# privaten Storage-Bucket «probe-packages» ab. nextDesk bietet immer das
# zuletzt gebaute Paket zum Herunterladen an (Überwachung → Sonden und
# Einstellungen → Monitoring).
#
# Läuft bei jeder Änderung am Agenten auf main und von Hand. Benötigt das
# Repository-Secret SUPABASE_ACCESS_TOKEN (wie «Deploy Supabase Edge
# Functions»); der Service-Schlüssel für den Upload wird damit zur Laufzeit
# gelesen und nirgends gespeichert.

on:
  push:
    branches: [main]
    paths:
      - "tools/ipam-agent/**"
      - ".github/workflows/publish-probe-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-package-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ewizsylzrwogsztsthbl
  BUCKET: probe-packages

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment:
      name: supabase-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        working-directory: tools/ipam-agent
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

      - name: Build package
        working-directory: tools/ipam-agent
        run: scripts/package.sh package "${GITHUB_SHA::7}"

      - name: Upload to Supabase Storage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Das Secret SUPABASE_ACCESS_TOKEN fehlt."
            exit 1
          fi
          key=$(curl -fsS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys?reveal=true" \
            | jq -r '[.[] | select(.name == "service_role" or .type == "secret")][0].api_key // empty')
          if [ -z "$key" ]; then
            echo "::error::Der Service-Schlüssel konnte nicht gelesen werden."
            exit 1
          fi
          echo "::add-mask::$key"
          base="https://$SUPABASE_PROJECT_REF.supabase.co/storage/v1/object/$BUCKET"
          cd tools/ipam-agent/package
          file=$(jq -r .file latest.json)
          upload() {
            # Der Speicher antwortet vereinzelt mit einem 5xx; dann erneut versuchen.
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -X POST "$base/$1" \
              -H "Authorization: Bearer $key" -H "apikey: $key" \
              -H "Content-Type: $2" -H "x-upsert: true" \
              --data-binary "@$1" >/dev/null
          }
          upload "$file" application/zip
          # latest.json zuletzt: erst dann zeigt nextDesk auf das neue Paket.
          upload latest.json application/json
          echo "Veröffentlicht: $file"
          cat latest.json
