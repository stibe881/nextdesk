name: Deploy Supabase Edge Functions

# Deploys edge functions with their full source (including _shared) via the
# Supabase CLI, so a running function no longer depends on loading its code
# from raw.githubusercontent.com when it starts.
#
# Requires the repository secret SUPABASE_ACCESS_TOKEN (a personal access
# token from https://supabase.com/dashboard/account/tokens).
# verify_jwt per function comes from supabase/config.toml.

on:
  workflow_dispatch:
    inputs:
      functions:
        description: Funktionsnamen, durch Leerzeichen getrennt (leer = alle)
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: ewizsylzrwogsztsthbl

jobs:
  deploy:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    environment:
      name: supabase-production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Das Secret SUPABASE_ACCESS_TOKEN fehlt."
            exit 1
          fi

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REQUESTED: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED// /}" ]; then
            names="$REQUESTED"
          else
            names=$(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts \
              -not -path 'supabase/functions/_shared/*' \
              | awk -F/ '{print $3}' | sort)
          fi
          failed=""
          for name in $names; do
            if [ ! -f "supabase/functions/$name/index.ts" ]; then
              echo "::warning::Unbekannte Funktion: $name"
              continue
            fi
            echo "::group::$name"
            if ! supabase functions deploy "$name" \
                --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes; then
              failed="$failed $name"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Fehlgeschlagen:$failed"
            exit 1
          fi
